<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine UNO Extreme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(-3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }
        .shake-active {
            animation: shake 0.1s infinite;
        }
        .uno-machine-bg {
            background: linear-gradient(135deg, #111113 0%, #1c1c21 50%, #111113 100%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .uno-stripes {
            background: linear-gradient(90deg, #dc2626 25%, #eab308 25%, #eab308 50%, #3b82f6 50%, #3b82f6 75%, #22c55e 75%);
        }
    </style>
</head>
<body class="h-full bg-zinc-950 text-white font-sans flex flex-col justify-between items-center p-4 select-none relative overflow-x-hidden">

    <!-- Bandes décoratives colorées de fond style UNO Extreme -->
    <div class="absolute top-0 left-0 w-full h-3 uno-stripes shadow-md"></div>

    <!-- En-tête -->
    <header class="w-full max-w-md text-center py-4 mt-2">
        <div style="text-align: center; margin: 20px 0;">
    <a href="https://imgbb.com/" target="_blank">
        <img src="https://i.ibb.co/SXvjXvf5/uno.png" 
             alt="uno" 
             style="width: 100%; max-width: 200px; height: auto; display: inline-block;" 
             border="0">
    </a>
</div>
        <p class="text-xs text-zinc-400 mt-1 tracking-widest uppercase font-semibold">Bouton Numérique</p>
    </header>

    <!-- Zone principale / Boîtier de la machine -->
    <main id="app-container" class="w-full max-w-md flex-1 flex flex-col items-center justify-center space-y-6 my-auto">
        
        <!-- Boîtier principal style coque de machine -->
        <div class="w-full uno-machine-bg border-4 border-zinc-800 rounded-[2.5rem] p-6 shadow-2xl flex flex-col items-center relative overflow-hidden">
            
            <div class="w-full flex justify-between items-center mb-4 px-2">
                <div class="flex space-x-1.5">
                    <span class="w-3.5 h-3.5 rounded-full bg-red-600 shadow-inner"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-yellow-400 shadow-inner"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-blue-500 shadow-inner"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-green-500 shadow-inner"></span>
                </div>
                <span class="text-[10px] font-bold text-zinc-500 tracking-widest uppercase">DrJeckyll Hack</span>
            </div>

            <!-- Écran d'affichage -->
            <div id="display-card" class="w-full bg-gradient-to-b from-zinc-900 to-zinc-950 border-4 border-zinc-700/80 rounded-3xl p-6 shadow-inner flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300 min-h-[200px]">
                
                <div id="light-indicator" class="absolute top-4 right-4 w-5 h-5 rounded-full bg-red-600 shadow-[0_0_12px_rgba(239,68,68,0.9)] transition-colors duration-200"></div>

                <div id="screen-content" class="text-center mt-2">
                    <span id="screen-title" class="text-xs font-bold tracking-widest text-zinc-400 uppercase">PRÊT À JOUER</span>
                    <div id="result-display" class="text-7xl font-black text-white mt-1 tracking-tight drop-shadow-md">--</div>
                    <p id="result-subtitle" class="text-xs text-zinc-300 mt-2 font-medium">Appuyez sur le bouton de la machine</p>
                </div>
            </div>

            <!-- Le Gros Bouton de la Machine (Lanceur) -->
            <div class="relative w-48 h-48 flex items-center justify-center mt-6">
                <div class="absolute inset-0 bg-red-600/20 rounded-full blur-2xl animate-pulse"></div>
                
                <button id="launcher-btn" onclick="triggerMachine()" class="relative w-40 h-40 bg-gradient-to-b from-red-500 via-red-600 to-red-800 hover:from-red-400 hover:to-red-700 active:scale-95 transition-all duration-150 rounded-full shadow-[0_10px_30px_rgba(220,38,38,0.7),inset_0_4px_6px_rgba(255,255,255,0.4)] border-4 border-red-300 flex flex-col items-center justify-center cursor-pointer group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-white group-hover:scale-110 transition-transform duration-200 drop-shadow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span class="text-xs font-black tracking-widest uppercase text-white mt-1 drop-shadow">APPUYER</span>
                </button>
            </div>

        </div>

    </main>

    <!-- Historique récent -->
    <footer class="w-full max-w-md bg-zinc-900/80 backdrop-blur-md rounded-2xl p-4 border border-zinc-800 shadow-xl mb-1">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Historique des tirs</span>
            <button onclick="clearHistory()" class="text-xs text-red-400 hover:underline">Effacer</button>
        </div>
        <div id="history-list" class="flex space-x-2 overflow-x-auto pb-1 text-sm text-zinc-300 min-h-[32px] items-center">
            <span class="text-xs text-zinc-500 italic">Aucun tir récent</span>
        </div>
    </footer>

    <!-- Bande colorée inférieure -->
    <div class="absolute bottom-0 left-0 w-full h-2 uno-stripes"></div>

    <!-- Script de simulation de la machine -->
    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function speakMachine(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.2;
                utterance.pitch = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playMachineSound(isSpinning) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isSpinning ? 'sawtooth' : 'sine';
                
                const now = audioCtx.currentTime;
                if (isSpinning) {
                    osc.frequency.setValueAtTime(80 + Math.random() * 100, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        let isRunning = false;
        const historyData = [];

        function triggerMachine() {
            if (isRunning) return;
            isRunning = true;

            const btn = document.getElementById('launcher-btn');
            const displayCard = document.getElementById('display-card');
            const resultDisplay = document.getElementById('result-display');
            const screenTitle = document.getElementById('screen-title');
            const resultSubtitle = document.getElementById('result-subtitle');
            const lightIndicator = document.getElementById('light-indicator');

            btn.disabled = true;
            displayCard.classList.add('shake-active');
            displayCard.classList.add('border-red-500');
            screenTitle.textContent = "ANALYSE...";
            resultSubtitle.textContent = "La machine tourne...";
            
            // Plus de "Attention !" prononcé ici

            let counter = 0;
            const maxTicks = 15;
            const intervalTime = 80;

            const interval = setInterval(() => {
                const tempVal = Math.floor(Math.random() * 11);
                resultDisplay.textContent = tempVal;
                
                lightIndicator.className = `absolute top-4 right-4 w-5 h-5 rounded-full transition-colors duration-100 ${counter % 2 === 0 ? 'bg-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.9)]' : 'bg-red-600 shadow-[0_0_15px_rgba(239,68,68,0.9)]'}`;
                
                playMachineSound(true);
                counter++;

                if (counter >= maxTicks) {
                    clearInterval(interval);
                    
                    const finalVal = getRandomExtremeCard();

                    displayCard.classList.remove('shake-active');
                    resultDisplay.textContent = finalVal;
                    
                    playMachineSound(false);

                    if (finalVal === 0) {
                        screenTitle.textContent = "C'EST GAGNÉ !";
                        resultSubtitle.textContent = "Aucune carte à piocher ! 🎉";
                        lightIndicator.className = "absolute top-4 right-4 w-5 h-5 rounded-full bg-green-500 shadow-[0_0_20px_rgba(34,197,94,0.9)]";
                        displayCard.classList.add('border-green-600');
                        speakMachine("Zéro carte ! Bien joué !");
                    } else if (finalVal === 1) {
                        screenTitle.textContent = "RÉSULTAT";
                        resultSubtitle.textContent = "Vous devez piocher 1 carte";
                        lightIndicator.className = "absolute top-4 right-4 w-5 h-5 rounded-full bg-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.9)]";
                        displayCard.classList.add('border-yellow-600');
                        speakMachine("Prenez une carte !");
                    } else if (finalVal <= 4) {
                        screenTitle.textContent = "RÉSULTAT";
                        resultSubtitle.textContent = `Vous devez piocher ${finalVal} cartes`;
                        lightIndicator.className = "absolute top-4 right-4 w-5 h-5 rounded-full bg-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.9)]";
                        displayCard.classList.add('border-yellow-600');
                        speakMachine(`Piochez ${finalVal} cartes !`);
                    } else {
                        screenTitle.textContent = "ATTAQUE EXTREME !";
                        resultSubtitle.textContent = `Aïe ! ${finalVal} cartes à piocher ! 😱`;
                        lightIndicator.className = "absolute top-4 right-4 w-5 h-5 rounded-full bg-red-600 shadow-[0_0_20px_rgba(239,68,68,0.9)]";
                        displayCard.classList.add('border-red-600');
                        speakMachine(`Attention ! ${finalVal} cartes !`);
                    }

                    addToHistory(finalVal);

                    setTimeout(() => {
                        displayCard.classList.remove('border-green-600', 'border-yellow-600', 'border-red-600');
                        displayCard.classList.add('border-zinc-700/80');
                        btn.disabled = false;
                        isRunning = false;
                    }, 400);
                }
            }, intervalTime);
        }

        function getRandomExtremeCard() {
            const rand = Math.random();
            if (rand < 0.25) return 0;
            if (rand < 0.45) return 1;
            if (rand < 0.65) return 2;
            if (rand < 0.80) return 3;
            if (rand < 0.90) return 4;
            if (rand < 0.95) return 5;
            if (rand < 0.98) return 6;
            return Math.floor(Math.random() * 4) + 7;
        }

        function addToHistory(val) {
            historyData.unshift(val);
            if (historyData.length > 6) historyData.pop();

            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';

            historyData.forEach(num => {
                const badge = document.createElement('div');
                let colorClass = "bg-zinc-800 text-zinc-200 border-zinc-600";
                if (num === 0) colorClass = "bg-green-900/80 text-green-200 border-green-600";
                else if (num >= 5) colorClass = "bg-red-900/80 text-red-200 border-red-600";
                
                badge.className = `px-3 py-1 rounded-full text-xs font-bold border ${colorClass} shrink-0`;
                badge.textContent = num === 0 ? '0 🥳' : `+${num}`;
                listEl.appendChild(badge);
            });
        }

        function clearHistory() {
            historyData.length = 0;
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '<span class="text-xs text-zinc-500 italic">Aucun tir récent</span>';
        }
    </script>
</body>
</html>
